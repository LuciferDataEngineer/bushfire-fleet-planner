name: Refresh snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 1"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Rebuild snapshot
        env:
          PYTHONPATH: src
        run: python scripts/build_snapshot.py
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: data/snapshot
          retention-days: 14
